# ------------------------------------------------------------
# BEVÁLT KREATÍV KONVENCIÓK — a "szokásos koncepció" kodifikálva
# (Ezt kéri Levi rendszeresen a grafikusoktól — pontosan tartsd be.)
creative_conventions:
  price_block: >
    Áthúzott normál ár (PIROS áthúzás) + nagy akciós ár + a megtakarítás kiemelve.
    Az akció érvényessége mindig szerepel és ki van emelve (pl. 'Az akció kizárólag SZOMBATIG érvényes').
  discount_display:
    - "forintosított kedvezmény (Ft-ban a megtakarítás)"
    - "százalékos kedvezmény (%)"
    - "/fő/éj bontás (pl. 'csak 9.900 Ft/fő/éj')"
  urgency_elements:
    - "Csak Ma ár (kiemelt, adott napra)"
    - "UTOLSÓ NAP! verzió"
    - "limitált darabszám / last minute"
    - "érvényességi dátum kiemelése"
  formats_per_campaign:
    - "1 db statikus grafika"
    - "1 db AI mozgó (mozgó jelenetes) videó"
    - "1 db beszélős AI videó"
  coupon_style: "ékezet nélkül, NAGYBETŰVEL (pl. MIKULAS40, KARACSONY20, LASTM2025)"
  themed_campaign_names:
    - "RED WEEK (Valentin)"
    - "PINK WEEKEND"
    - "BLACK WEEK / BLACK WEEKEND"
  notes: >
    Visszatérő igény: 'a grafika legyen ugyanaz mint tavaly, mert nagyon mentünk vele' —
    a bevált kampány-vizuálokat évről évre újrahasznosítjuk, csak ár/dátum frissül.
