<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>2048 — Választható rács</title>
<style>
  :root {
    --bg: #faf8ef;
    --board: #bbada0;
    --cell: #cdc1b4;
    --text-dark: #776e65;
    --text-light: #f9f6f2;
    --btn: #8f7a66;
    --gap: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    font-family: "Helvetica Neue", Arial, sans-serif;
    color: var(--text-dark);
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100%;
  }

  .wrap {
    width: 100%;
    max-width: 500px;
    padding: 16px;
    flex: 1 0 auto;
  }

  /* ---- Fejléc ---- */
  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
  }
  .logo {
    background: #edc22e;
    color: #fff;
    font-weight: 700;
    font-size: 40px;
    border-radius: 6px;
    padding: 14px 18px;
    line-height: 1;
  }
  .scores { display: flex; gap: 8px; }
  .score-box {
    background: var(--board);
    color: var(--text-light);
    border-radius: 6px;
    padding: 8px 14px;
    text-align: center;
    min-width: 84px;
  }
  .score-box .label {
    font-size: 12px;
    letter-spacing: 1px;
    color: #eee4da;
    text-transform: uppercase;
  }
  .score-box .value { font-size: 22px; font-weight: 700; }

  /* ---- Vezérlők ---- */
  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .board-info {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-dark);
  }
  .board-info span { color: #8f7a66; font-weight: 400; }
  .ctrl-btns { display: flex; align-items: center; gap: 8px; }
  .icon-btn {
    background: var(--cell);
    color: var(--text-dark);
    border: none;
    border-radius: 6px;
    width: 38px;
    height: 38px;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s;
  }
  .icon-btn:hover { background: #d7ccbf; }
  .icon-btn:disabled { opacity: .4; cursor: default; }
  .new-game {
    background: var(--btn);
    color: var(--text-light);
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }

  .subtitle { font-size: 14px; color: var(--text-dark); margin-bottom: 12px; }
  .subtitle b { color: #776e65; }

  /* ---- Tábla ---- */
  .board-outer { position: relative; }
  .board {
    position: relative;
    background: var(--board);
    border-radius: 8px;
    padding: var(--gap);
    width: 100%;
    aspect-ratio: 1 / 1;
    touch-action: none;
  }
  .grid-bg {
    position: absolute;
    inset: var(--gap);
    display: grid;
    gap: var(--gap);
  }
  .grid-cell { background: var(--cell); border-radius: 6px; }

  .tiles { position: absolute; inset: var(--gap); }
  /* Külső elem = pozíció (translate + transition), belső elem = megjelenés (scale).
     Így a pop/appear scale-animáció nem írja felül a csúszó translate-et. */
  .tile {
    position: absolute;
    transition: transform 100ms ease-in-out;
    will-change: transform;
  }
  .tile-inner {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    font-weight: 700;
    background: #eee4da;
    color: var(--text-dark);
  }
  .tile.pop .tile-inner { animation: pop 180ms ease; }
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
  .tile.new .tile-inner { animation: appear 180ms ease; }
  @keyframes appear {
    0% { opacity: 0; transform: scale(0); }
    100% { opacity: 1; transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .tile { transition: none; }
    .tile.pop .tile-inner, .tile.new .tile-inner { animation: none; }
  }

  /* Egyszerű, nem zavaró színskála — homokszínből meleg felé */
  .v2    { background:#eee4da; color:#776e65; }
  .v4    { background:#ede0c8; color:#776e65; }
  .v8    { background:#f2d0a4; color:#776e65; }
  .v16   { background:#f5c088; color:#776e65; }
  .v32   { background:#f3aa6d; color:#fff; }
  .v64   { background:#ee8f5a; color:#fff; }
  .v128  { background:#edcf72; color:#fff; }
  .v256  { background:#edcc61; color:#fff; }
  .v512  { background:#edc850; color:#fff; }
  .v1024 { background:#edc53f; color:#fff; }
  .v2048 { background:#edc22e; color:#fff; }
  .vhigh { background:#3c3a32; color:#fff; }

  /* ---- Game over ---- */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(250,248,239,.78);
    border-radius: 8px;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 5;
  }
  .overlay.show { display: flex; }
  .overlay h2 { font-size: 28px; color: var(--text-dark); }
  .overlay .hint { font-size: 13px; color: #8f7a66; margin-top: -4px; }

  .board-select {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    width: 82%;
    max-width: 300px;
  }
  .board-opt {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    background: var(--cell);
    color: var(--text-dark);
    border: 2px solid transparent;
    border-radius: 8px;
    padding: 12px 8px;
    cursor: pointer;
    font-family: inherit;
    transition: background .15s;
  }
  .board-opt:hover { background: #d7ccbf; }
  .board-opt.current { border-color: var(--btn); }
  .bo-size { font-size: 20px; font-weight: 700; }
  .bo-rec { font-size: 12px; color: #8f7a66; }

  /* ---- Reklámhely alul ---- */
  .ad-slot {
    flex-shrink: 0;
    width: 100%;
    max-width: 500px;
    height: 90px;
    margin: 10px auto 8px;
    background: #f0ede4;
    border: 1px dashed #cdc1b4;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #b8ab9c;
    font-size: 13px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">2048</div>
      <div class="scores">
        <div class="score-box">
          <div class="label">Pont</div>
          <div class="value" id="score">0</div>
        </div>
        <div class="score-box">
          <div class="label">Legjobb</div>
          <div class="value" id="best">0</div>
        </div>
      </div>
    </header>

    <div class="controls">
      <div class="board-info" id="boardInfo">4×4</div>
      <div class="ctrl-btns">
        <button class="icon-btn" id="soundBtn" title="Hang be/ki" aria-label="Hang be/ki">🔊</button>
        <button class="icon-btn" id="undoBtn" title="Visszavonás" aria-label="Visszavonás" disabled>↶</button>
        <button class="new-game" id="newGame">Új játék</button>
      </div>
    </div>

    <div class="subtitle">Húzd össze az azonos csempéket a <b>2048</b>-ig!</div>

    <div class="board-outer">
      <div class="board" id="board">
        <div class="grid-bg" id="gridBg"></div>
        <div class="tiles" id="tiles"></div>
        <div class="overlay" id="overlay">
          <h2 id="overlayText">Új játék</h2>
          <div class="hint" id="overlayHint">Válaszd ki a pályát</div>
          <div class="board-select" id="boardSelect"></div>
          <button class="new-game" id="continueBtn" style="display:none">Vissza a játékhoz</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Reklámhely -->
  <div class="ad-slot">REKLÁM</div>

<script>
(function () {
  "use strict";

  var board = document.getElementById("board");
  var gridBg = document.getElementById("gridBg");
  var tilesEl = document.getElementById("tiles");
  var scoreEl = document.getElementById("score");
  var bestEl = document.getElementById("best");
  var overlay = document.getElementById("overlay");
  var overlayText = document.getElementById("overlayText");
  var overlayHint = document.getElementById("overlayHint");
  var boardSelect = document.getElementById("boardSelect");
  var boardInfo = document.getElementById("boardInfo");
  var continueBtn = document.getElementById("continueBtn");
  var soundBtn = document.getElementById("soundBtn");
  var undoBtn = document.getElementById("undoBtn");
  var GAP = 10;
  var SIZES = [3, 4, 5, 6];
  var MAX_UNDO = 20;

  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  var size = parseInt(lsGet("g2048_size", "4"), 10) || 4;
  var grid = [];       // size×size, cellák értékei (0 = üres)
  var score = 0;
  var best = {};
  try { best = JSON.parse(lsGet("g2048_best", "{}")); } catch (e) { best = {}; }
  var idSeq = 1;
  var tileMap = {};    // id -> DOM elem
  var busy = false;
  var history = [];    // undo verem (lépés előtti állapotok)
  var soundOn = lsGet("g2048_sound", "1") !== "0";
  var audioCtx = null;

  /* ---------- Segédek ---------- */
  function emptyGrid(n) {
    var g = [];
    for (var r = 0; r < n; r++) { g.push(new Array(n).fill(null)); }
    return g;
  }

  function forEachCell(fn) {
    for (var r = 0; r < size; r++)
      for (var c = 0; c < size; c++)
        fn(r, c);
  }

  function cellSizePx() {
    var inner = board.clientWidth - GAP * 2;
    return (inner - GAP * (size - 1)) / size;
  }

  function fontFor(value) {
    var cs = cellSizePx();
    var digits = String(value).length;
    var base = cs * 0.42;
    if (digits >= 4) base = cs * 0.30;
    else if (digits === 3) base = cs * 0.36;
    return Math.max(12, Math.round(base)) + "px";
  }

  function valueClass(v) {
    if (v <= 2048) return "v" + v;
    return "vhigh";
  }

  /* ---------- Rács kirajzolás ---------- */
  function buildGridBg() {
    gridBg.style.gridTemplateColumns = "repeat(" + size + ", 1fr)";
    gridBg.style.gridTemplateRows = "repeat(" + size + ", 1fr)";
    gridBg.innerHTML = "";
    for (var i = 0; i < size * size; i++) {
      var d = document.createElement("div");
      d.className = "grid-cell";
      gridBg.appendChild(d);
    }
  }

  function positionTile(el, r, c) {
    var cs = cellSizePx();
    var x = c * (cs + GAP);
    var y = r * (cs + GAP);
    el.style.width = cs + "px";
    el.style.height = cs + "px";
    el.style.transform = "translate(" + x + "px," + y + "px)";
    if (el._inner) el._inner.style.fontSize = fontFor(el._value);
  }

  function createTileEl(tile, animate) {
    var el = document.createElement("div");
    el.className = "tile" + (animate === false ? "" : " new");
    var inner = document.createElement("div");
    inner.className = "tile-inner " + valueClass(tile.value);
    inner.textContent = tile.value;
    el._inner = inner;
    el._value = tile.value;
    el.appendChild(inner);
    positionTile(el, tile.r, tile.c);
    tilesEl.appendChild(el);
    tileMap[tile.id] = el;
  }

  function updateTileEl(tile, pop) {
    var el = tileMap[tile.id];
    if (!el) return;
    el._value = tile.value;
    el._inner.textContent = tile.value;
    el._inner.className = "tile-inner " + valueClass(tile.value);
    el.classList.remove("new");
    positionTile(el, tile.r, tile.c);
    if (pop) {
      el.classList.remove("pop");
      void el.offsetWidth; // reflow: újraindítja a pop animációt
      el.classList.add("pop");
    }
  }

  /* ---------- Állapot mentés / visszaállítás ---------- */
  function collectCells() {
    var out = [];
    forEachCell(function (r, c) {
      var t = grid[r][c];
      if (t) out.push({ r: r, c: c, value: t.value });
    });
    return out;
  }

  function snapshot() {
    return { cells: collectCells(), score: score, won: !!grid._won };
  }

  // Egy pálya betöltése cellalistából (undo és visszaállítás; animáció nélkül).
  function loadBoard(n, cells, sc, won) {
    size = n;
    lsSet("g2048_size", String(n));
    grid = emptyGrid(n);
    grid._won = !!won;
    tilesEl.innerHTML = "";
    tileMap = {};
    buildGridBg();
    cells.forEach(function (c) {
      var tile = { id: idSeq++, r: c.r, c: c.c, value: c.value };
      grid[c.r][c.c] = tile;
      createTileEl(tile, false);
    });
    score = sc || 0;
    scoreEl.textContent = score;
    boardInfo.textContent = n + "×" + n;
    bestEl.textContent = best[String(n)] || 0;
  }

  function saveState() {
    lsSet("g2048_state", JSON.stringify({
      size: size, score: score, won: !!grid._won, cells: collectCells()
    }));
  }

  function restoreState() {
    var raw = lsGet("g2048_state", null);
    if (!raw) return false;
    var s;
    try { s = JSON.parse(raw); } catch (e) { return false; }
    if (!s || !s.cells || !s.cells.length || SIZES.indexOf(s.size) < 0) return false;
    loadBoard(s.size, s.cells, s.score || 0, s.won);
    history = [];
    updateUndoBtn();
    return true;
  }

  function relayout() {
    forEachCell(function (r, c) {
      var t = grid[r][c];
      if (t && tileMap[t.id]) positionTile(tileMap[t.id], r, c);
    });
  }

  /* ---------- Játéklogika ---------- */
  function spawn() {
    var empties = [];
    forEachCell(function (r, c) { if (!grid[r][c]) empties.push([r, c]); });
    if (!empties.length) return null;
    var pos = empties[Math.floor(Math.random() * empties.length)];
    var value = Math.random() < 0.9 ? 2 : 4;
    var tile = { id: idSeq++, r: pos[0], c: pos[1], value: value };
    grid[pos[0]][pos[1]] = tile;
    createTileEl(tile);
    return tile;
  }

  // Egy sor/oszlop értéklistából csúsztat balra, összeolvaszt.
  // Visszaadja a cél-tömböt (tile-okkal), és jelzi, változott-e.
  function slideLine(line) {
    // line: tile vagy null tömb, hossz = size
    var tiles = line.filter(Boolean);
    var result = [];
    var moved = false;
    var gained = 0;
    for (var i = 0; i < tiles.length; i++) {
      if (i + 1 < tiles.length && tiles[i].value === tiles[i + 1].value) {
        // összeolvad
        var merged = tiles[i];
        merged.value *= 2;
        merged._merged = true;
        merged._absorb = tiles[i + 1]; // eltűnő csempe
        gained += merged.value;
        result.push(merged);
        i++;
        moved = true;
      } else {
        result.push(tiles[i]);
      }
    }
    // padding null-lal
    while (result.length < size) result.push(null);
    // változás detektálás pozíció szerint
    for (var j = 0; j < size; j++) {
      var before = line[j];
      var after = result[j];
      if ((before && !after) || (!before && after) ||
          (before && after && before.id !== after.id) ||
          (after && after._merged)) {
        moved = true;
      }
    }
    return { line: result, moved: moved, gained: gained };
  }

  function getLine(dir, index) {
    // dir: 'L','R','U','D'; visszaad size hosszú tömböt a mozgás irányában rendezve
    var line = [];
    for (var i = 0; i < size; i++) {
      var r, c;
      if (dir === "L") { r = index; c = i; }
      else if (dir === "R") { r = index; c = size - 1 - i; }
      else if (dir === "U") { r = i; c = index; }
      else { r = size - 1 - i; c = index; }
      line.push(grid[r][c]);
    }
    return line;
  }

  function setLine(dir, index, line) {
    for (var i = 0; i < size; i++) {
      var r, c;
      if (dir === "L") { r = index; c = i; }
      else if (dir === "R") { r = index; c = size - 1 - i; }
      else if (dir === "U") { r = i; c = index; }
      else { r = size - 1 - i; c = index; }
      grid[r][c] = line[i];
      if (line[i]) { line[i].r = r; line[i].c = c; }
    }
  }

  function move(dir) {
    if (busy) return;
    if (overlay.classList.contains("show")) return; // választó nyitva
    var pre = snapshot();
    var anyMoved = false;
    var totalGain = 0;
    var absorbed = [];

    for (var index = 0; index < size; index++) {
      var line = getLine(dir, index);
      var res = slideLine(line);
      if (res.moved) anyMoved = true;
      totalGain += res.gained;
      for (var k = 0; k < res.line.length; k++) {
        var t = res.line[k];
        if (t && t._absorb) { absorbed.push(t._absorb); }
      }
      setLine(dir, index, res.line);
    }

    if (!anyMoved) return;

    // érvényes lépés: mentsük az előző állapotot az undóhoz
    history.push(pre);
    if (history.length > MAX_UNDO) history.shift();
    updateUndoBtn();

    score += totalGain;
    scoreEl.textContent = score;

    if (totalGain > 0) { playMerge(); if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e) {} } }

    // animáljuk a mozgó csempéket új pozíciójukba;
    // az összeolvadó (eltűnő) csempe is odacsúszik a célcellába
    forEachCell(function (r, c) {
      var t = grid[r][c];
      if (!t) return;
      if (tileMap[t.id]) positionTile(tileMap[t.id], r, c);
      if (t._absorb && tileMap[t._absorb.id]) positionTile(tileMap[t._absorb.id], r, c);
    });

    busy = true;
    setTimeout(function () {
      // eltűnő (beolvadt) csempék törlése + pop
      absorbed.forEach(function (t) {
        var el = tileMap[t.id];
        if (el) { el.remove(); delete tileMap[t.id]; }
      });
      forEachCell(function (r, c) {
        var t = grid[r][c];
        if (t && t._merged) {
          updateTileEl(t, true);
          t._merged = false;
          t._absorb = null;
        }
      });

      spawn();
      saveBest();
      saveState();
      busy = false;

      if (isGameOver()) showSelect("Vége!", "Válassz pályát az újrakezdéshez", false);
      else if (hasWon()) showSelect("Nyertél! 🎉", "Játssz tovább, vagy válts pályát", true);
    }, 100);
  }

  function hasWon() {
    if (grid._won) return false;
    var won = false;
    forEachCell(function (r, c) {
      if (grid[r][c] && grid[r][c].value >= 2048) won = true;
    });
    if (won) grid._won = true;
    return won;
  }

  function isGameOver() {
    var full = true;
    forEachCell(function (r, c) { if (!grid[r][c]) full = false; });
    if (!full) return false;
    // van-e szomszédos egyforma
    for (var r = 0; r < size; r++) {
      for (var c = 0; c < size; c++) {
        var v = grid[r][c].value;
        if (c + 1 < size && grid[r][c + 1].value === v) return false;
        if (r + 1 < size && grid[r + 1][c].value === v) return false;
      }
    }
    return true;
  }

  // Választóképernyő: pályaméretek + rekordok.
  // canContinue = true esetén megjelenik a "Vissza a játékhoz" gomb.
  function showSelect(title, hint, canContinue) {
    overlayText.textContent = title;
    overlayHint.textContent = hint || "";
    renderBoardOptions();
    continueBtn.style.display = canContinue ? "" : "none";
    overlay.classList.add("show");
  }
  function hideOverlay() { overlay.classList.remove("show"); }

  function renderBoardOptions() {
    boardSelect.innerHTML = "";
    SIZES.forEach(function (n) {
      var rec = best[String(n)] || 0;
      var b = document.createElement("button");
      b.className = "board-opt" + (n === size ? " current" : "");
      var s = document.createElement("span");
      s.className = "bo-size";
      s.textContent = n + "×" + n;
      var r = document.createElement("span");
      r.className = "bo-rec";
      r.textContent = "Rekord: " + (rec ? rec : "—");
      b.appendChild(s);
      b.appendChild(r);
      b.addEventListener("click", function () { startWith(n); });
      boardSelect.appendChild(b);
    });
  }

  function startWith(n) {
    size = n;
    localStorage.setItem("g2048_size", String(n));
    newGame();
  }

  /* ---------- Pontszám mentés ---------- */
  function saveBest() {
    var key = String(size);
    if (!best[key] || score > best[key]) {
      best[key] = score;
      localStorage.setItem("g2048_best", JSON.stringify(best));
    }
    bestEl.textContent = best[key] || 0;
  }

  /* ---------- Új játék ---------- */
  function newGame() {
    hideOverlay();
    history = [];
    updateUndoBtn();
    score = 0;
    scoreEl.textContent = 0;
    grid = emptyGrid(size);
    grid._won = false;
    tilesEl.innerHTML = "";
    tileMap = {};
    buildGridBg();
    boardInfo.textContent = size + "×" + size;
    bestEl.textContent = best[String(size)] || 0;
    spawn();
    spawn();
    saveState();
  }

  /* ---------- Visszavonás ---------- */
  function undo() {
    if (!history.length) return;
    hideOverlay();                 // vesztő/nyerő lépés is visszavonható
    var s = history.pop();
    loadBoard(size, s.cells, s.score, s.won);
    updateUndoBtn();
    saveState();
  }

  function updateUndoBtn() {
    undoBtn.disabled = history.length === 0;
  }

  /* ---------- Hang + rezgés ---------- */
  function ensureAudio() {
    if (audioCtx) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    } catch (e) { audioCtx = null; }
    if (audioCtx && audioCtx.state === "suspended") {
      try { audioCtx.resume(); } catch (e) {}
    }
  }

  function playMerge() {
    if (!soundOn) return;
    ensureAudio();
    if (!audioCtx) return;
    var t = audioCtx.currentTime;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(330, t);
    o.frequency.exponentialRampToValueAtTime(520, t + 0.09);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.11, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
    o.connect(g).connect(audioCtx.destination);
    o.start(t);
    o.stop(t + 0.16);
  }

  function updateSoundBtn() {
    soundBtn.textContent = soundOn ? "🔊" : "🔇";
    soundBtn.setAttribute("aria-pressed", soundOn ? "true" : "false");
  }

  function toggleSound() {
    soundOn = !soundOn;
    lsSet("g2048_sound", soundOn ? "1" : "0");
    updateSoundBtn();
    if (soundOn) { ensureAudio(); playMerge(); }
  }

  /* ---------- Bemenet ---------- */
  document.addEventListener("keydown", function (e) {
    if (e.key === "u" || e.key === "z" || e.key === "Backspace") {
      e.preventDefault(); undo(); return;
    }
    var map = { ArrowLeft: "L", ArrowRight: "R", ArrowUp: "U", ArrowDown: "D",
                a: "L", d: "R", w: "U", s: "D" };
    var dir = map[e.key];
    if (dir) { e.preventDefault(); move(dir); }
  });

  // Érintés / swipe
  var touchStart = null;
  board.addEventListener("touchstart", function (e) {
    var t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  board.addEventListener("touchend", function (e) {
    if (!touchStart) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - touchStart.x;
    var dy = t.clientY - touchStart.y;
    var absX = Math.abs(dx), absY = Math.abs(dy);
    if (Math.max(absX, absY) < 24) { touchStart = null; return; }
    if (absX > absY) move(dx > 0 ? "R" : "L");
    else move(dy > 0 ? "D" : "U");
    touchStart = null;
  }, { passive: true });

  document.getElementById("newGame").addEventListener("click", function () {
    showSelect("Új játék", "Válaszd ki a pályát", true);
  });
  continueBtn.addEventListener("click", hideOverlay);
  undoBtn.addEventListener("click", undo);
  soundBtn.addEventListener("click", toggleSound);

  window.addEventListener("resize", relayout);

  /* ---------- Indítás ---------- */
  updateSoundBtn();
  if (!restoreState()) newGame();   // korábbi állás visszatöltése, ha van
  updateUndoBtn();
})();
</script>
</body>
</html>
